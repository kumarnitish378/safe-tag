{% extends "base.html" %}
{% block title %}Create Account — Safe-Tag{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="{{ url_for('index') }}" class="inline-flex items-center gap-2 mb-4">
        <span class="w-10 h-10 rounded-full bg-teal flex items-center justify-center text-white font-display font-bold">ST</span>
        <span class="font-display font-bold text-teal text-xl">Safe-Tag</span>
      </a>
      <h1 class="font-display font-bold text-2xl text-gray-900">Create your account</h1>
      <p class="text-gray-400 mt-1">Start protecting your loved ones</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <form action="{{ url_for('register') }}" method="POST" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
          <input name="email" type="email" required placeholder="you@example.com"
                 class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-teal focus:ring-2 focus:ring-teal/10 transition-all">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Mobile Number</label>
          <input name="mobile_no" type="tel" required placeholder="+91 98765 43210"
                 class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-teal focus:ring-2 focus:ring-teal/10 transition-all">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Address <span class="text-gray-400">(optional)</span></label>
          <input name="address" type="text" placeholder="City, State"
                 class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-teal focus:ring-2 focus:ring-teal/10 transition-all">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
          <input name="password" type="password" required placeholder="Min. 8 characters"
                 class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-teal focus:ring-2 focus:ring-teal/10 transition-all">
        </div>
        <button type="submit"
                class="w-full bg-teal text-white font-semibold py-3.5 rounded-xl hover:bg-teal-dark transition-colors text-sm mt-2">
          Create Account
        </button>
        <p class="text-center text-xs text-gray-400 leading-relaxed">
          By signing up you agree to our
          <a href="#" class="text-teal hover:underline">Privacy Policy</a> &
          <a href="#" class="text-teal hover:underline">Terms</a>.
        </p>
      </form>
      <p class="text-center text-sm text-gray-400 mt-5">
        Already have an account?
        <a href="{{ url_for('login') }}" class="text-teal font-semibold hover:underline">Log In</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
