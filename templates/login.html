{% extends "base.html" %}
{% block title %}Log In — Safe-Tag{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="{{ url_for('index') }}" class="inline-flex items-center gap-2 mb-4">
        <span class="w-10 h-10 rounded-full bg-teal flex items-center justify-center text-white font-display font-bold">ST</span>
        <span class="font-display font-bold text-teal text-xl">Safe-Tag</span>
      </a>
      <h1 class="font-display font-bold text-2xl text-gray-900">Welcome back</h1>
      <p class="text-gray-400 mt-1">Manage your safety tags</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <div method="POST" class="space-y-5">
        <form action="{{ url_for('login') }}" method="POST">
          {{ csrf_token() }}
          <div class="space-y-5">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
              <input name="email" type="email" required placeholder="you@example.com"
                     class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-teal focus:ring-2 focus:ring-teal/10 transition-all">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
              <input name="password" type="password" required placeholder="••••••••"
                     class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-teal focus:ring-2 focus:ring-teal/10 transition-all">
            </div>
            <button type="submit"
                    class="w-full bg-teal text-white font-semibold py-3.5 rounded-xl hover:bg-teal-dark transition-colors text-sm">
              Log In
            </button>
          </div>
        </form>
      </div>
      <p class="text-center text-sm text-gray-400 mt-5">
        Don't have an account?
        <a href="{{ url_for('register') }}" class="text-teal font-semibold hover:underline">Register</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
