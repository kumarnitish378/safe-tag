name: CI / Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Tailwind CSS (dist)
        run: npx tailwindcss -i ./public/css/input.css -o ./public/css/safetag.build.css --minify

      - name: Verify build artifact exists
        run: test -f public/css/safetag.build.css && echo "✅ safetag.build.css generated"

      - name: Show CSS bundle size
        run: du -sh public/css/safetag.build.css

  deploy:
    name: Deploy to Render
    needs: build
    runs-on: ubuntu-latest
    # Only deploy on direct push to master (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Trigger Render deploy hook
        # Add RENDER_DEPLOY_HOOK to GitHub repo secrets to enable gated deploys.
        # If not set, Render auto-deploys via its native GitHub integration.
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "✅ Render deploy triggered"
          else
            echo "ℹ️  RENDER_DEPLOY_HOOK not set — Render will auto-deploy from GitHub push"
          fi
